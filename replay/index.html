<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Replay</title>
<!--
  Replay viewer for sailsim race files.

  Loads a JSON written by make_replay.py. Deliberately a file PICKER rather than a
  fetch: browsers block fetch() on file:// URLs, so a page that auto-loaded its
  data would only work behind a web server. This one works by double-clicking it.

  It reads `frame_fields` from the file rather than assuming the frame layout, so
  a file written by a newer exporter with reordered columns still plays instead of
  drawing nonsense. It refuses a schema it does not know.

  No dependencies, no build step, one file.
-->
<style>
  :root {
    --bg: #0b1622;
    --panel: #10202f;
    --line: #23384c;
    --ink: #e8eef4;
    --dim: #8aa3b8;
    --accent: #4aa8e0;
    --stbd: #35c46b;   /* starboard tack: green, as on a boat */
    --port: #e2555a;   /* port tack: red */
    --warn: #f5a623;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .meta { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  aside {
    width: 290px; border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 12px 14px; flex-shrink: 0;
  }
  aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 16px 0 8px; font-weight: 600;
  }
  aside h2:first-child { margin-top: 0; }
  footer {
    border-top: 1px solid var(--line); padding: 10px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04121d; font-weight: 600; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  select { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 8px; font: inherit; }
  .clock { font-variant-numeric: tabular-nums; min-width: 92px; color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td { padding: 2px 0; }
  td.pos { color: var(--dim); width: 22px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  tr.sel td { color: var(--accent); font-weight: 600; }
  tr { cursor: pointer; }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .note { font-size: 11.5px; color: var(--dim); line-height: 1.5; }
  .warnbox {
    border: 1px solid #6b4a12; background: #251a08; color: #f0c675;
    border-radius: 6px; padding: 8px 10px; font-size: 11.5px; line-height: 1.5;
  }
  #drop {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 24px;
    background: var(--bg); z-index: 5;
  }
  #drop.hide { display: none; }
  #drop .big { font-size: 17px; font-weight: 600; }
  #drop.over { outline: 2px dashed var(--accent); outline-offset: -14px; }
  kbd {
    background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; font: 11px ui-monospace, monospace;
  }
</style>
</head>
<body>

<header>
  <h1>Race replay</h1>
  <span class="meta" id="headline">no race loaded</span>
  <span style="flex:1"></span>
  <button id="pick">Load a race…</button>
</header>

<main>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="drop">
      <div class="big">Drop a replay file here</div>
      <div class="note">
        A JSON written by <kbd>python3 make_replay.py</kbd>, by default at
        <kbd>out/replay.json</kbd>.<br>
        Nothing is uploaded — the file is read in your browser.
      </div>
      <button class="primary" id="pick2">Choose file…</button>
    </div>
  </div>
  <aside>
    <h2>Order</h2>
    <table id="board"><tbody></tbody></table>
    <h2>Wind</h2>
    <div class="note" id="windinfo">—</div>
    <h2>Selected boat</h2>
    <div class="note" id="boatinfo">Click a boat or a row.</div>
    <h2>Provenance</h2>
    <div class="warnbox" id="prov">—</div>
  </aside>
</main>

<footer>
  <button class="primary" id="play">Play</button>
  <input type="range" id="scrub" min="0" max="100" value="0" step="1">
  <span class="clock" id="clock">—</span>
  <select id="rate">
    <option value="1">1×</option>
    <option value="2">2×</option>
    <option value="4" selected>4×</option>
    <option value="8">8×</option>
    <option value="16">16×</option>
  </select>
  <select id="colour">
    <option value="tack">colour: tack</option>
    <option value="dirty">colour: dirty air</option>
    <option value="rank">colour: finish</option>
  </select>
  <label class="note"><input type="checkbox" id="trails" checked> trails</label>
</footer>

<input type="file" id="file" accept=".json,application/json" hidden>

<script>
"use strict";

const SUPPORTED_SCHEMA = 1;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let race = null;      // the loaded document
let idx = null;       // column indices, read from the file
let playing = false;
let tNow = 0;         // seconds, in the race's own clock
let selected = null;
let view = { scale: 1, ox: 0, oy: 0 };

/* ---------- loading ---------- */

function load(text) {
  let doc;
  try { doc = JSON.parse(text); }
  catch (e) { alert("That file is not valid JSON."); return; }

  if (doc.schema !== SUPPORTED_SCHEMA) {
    // Refusing beats drawing nonsense: a frame layout change would otherwise
    // render as boats sailing backwards at impossible speeds.
    alert(`This file is schema ${doc.schema ?? "unstamped"}; this viewer reads ${SUPPORTED_SCHEMA}.`);
    return;
  }
  if (!doc.boats || !doc.boats.length) { alert("No boats in that file."); return; }

  race = doc;
  // Read the layout rather than assuming it.
  const f = doc.frame_fields;
  idx = {
    t: f.indexOf("t"), x: f.indexOf("x"), y: f.indexOf("y"),
    hdg: f.indexOf("heading"), spd: f.indexOf("speed_kt"),
    def: f.indexOf("deficit"), flags: f.indexOf("flags"), leg: f.indexOf("leg"),
  };

  tNow = doc.meta.start_t;
  selected = null;
  document.getElementById("drop").classList.add("hide");
  document.getElementById("scrub").min = doc.meta.start_t;
  document.getElementById("scrub").max = doc.meta.duration_s;
  document.getElementById("scrub").value = doc.meta.start_t;

  const m = doc.meta;
  document.getElementById("headline").textContent =
    `${doc.boats.length} boats · ${m.wind} wind · ${m.polar} · line ${m.line_bias_deg > 0 ? "+" : ""}` +
    `${m.line_bias_deg}° (${m.favoured_end} favoured) · ${m.fouls} fouls · ${m.ocs} OCS`;
  document.getElementById("prov").innerHTML =
    (m.estimates && m.estimates.length
      ? m.estimates.map(e => "• " + e).join("<br>")
      : "No estimates declared.") +
    "<br><br>Magnitudes in this replay come from estimated polars and synthetic wind. " +
    "Watch the <em>shapes</em>, not the numbers.";

  fit();
  draw();
}

document.getElementById("file").addEventListener("change", e => {
  const file = e.target.files[0];
  if (file) file.text().then(load);
});
for (const id of ["pick", "pick2"]) {
  document.getElementById(id).addEventListener("click", () => document.getElementById("file").click());
}
const drop = document.getElementById("drop");
document.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
document.addEventListener("dragleave", () => drop.classList.remove("over"));
document.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  const file = e.dataTransfer.files[0];
  if (file) file.text().then(load);
});

/* ---------- geometry ---------- */

function fit() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!race) return;

  // Fit the course plus every boat's track, so nothing sails off screen.
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const consider = (x, y) => {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  };
  for (const m of race.course.marks) consider(m.x, m.y);
  consider(...race.course.start_pin); consider(...race.course.start_boat);
  for (const b of race.boats) for (const fr of b.frames) consider(fr[idx.x], fr[idx.y]);

  const pad = 40;
  const w = rect.width - pad * 2, h = rect.height - pad * 2;
  view.scale = Math.min(w / Math.max(maxX - minX, 1), h / Math.max(maxY - minY, 1));
  view.ox = pad + (w - (maxX - minX) * view.scale) / 2 - minX * view.scale;
  // Screen y is inverted: north is up.
  view.oy = pad + (h - (maxY - minY) * view.scale) / 2 + maxY * view.scale;
}
const sx = x => x * view.scale + view.ox;
const sy = y => view.oy - y * view.scale;

/* ---------- frame lookup ---------- */

function frameAt(boat, t) {
  const fr = boat.frames;
  if (!fr.length) return null;
  // Frames are evenly spaced and sorted, so interpolate the index directly
  // instead of scanning 1,400 entries per boat per repaint.
  const t0 = fr[0][idx.t], t1 = fr[fr.length - 1][idx.t];
  if (t <= t0) return fr[0];
  if (t >= t1) return fr[fr.length - 1];
  const step = (t1 - t0) / (fr.length - 1);
  let i = Math.round((t - t0) / step);
  i = Math.max(0, Math.min(fr.length - 1, i));
  return fr[i];
}

function boatColour(boat, fr) {
  const mode = document.getElementById("colour").value;
  if (fr[idx.flags] & 2) return "#c07bff";               // spinning a penalty
  if (mode === "dirty") {
    const d = fr[idx.def];
    if (d <= 0.01) return "#4fd1c5";
    const k = Math.min(1, d / 0.4);
    return `rgb(${Math.round(80 + 175 * k)},${Math.round(200 - 140 * k)},${Math.round(190 - 150 * k)})`;
  }
  if (mode === "rank") {
    const k = (boat.finish_rank - 1) / Math.max(1, race.boats.length - 1);
    return `rgb(${Math.round(70 + 165 * k)},${Math.round(200 - 90 * k)},${Math.round(230 - 150 * k)})`;
  }
  // Tack, from the wind at this instant. Green starboard, red port — the colours
  // a sailor already has in their head.
  const wind = windAt(fr[idx.t]);
  let twa = ((wind - fr[idx.hdg]) % 360 + 540) % 360 - 180;
  return twa >= 0 ? "var-stbd" : "var-port";
}
const CSS = getComputedStyle(document.documentElement);
function resolve(c) {
  if (c === "var-stbd") return CSS.getPropertyValue("--stbd").trim();
  if (c === "var-port") return CSS.getPropertyValue("--port").trim();
  return c;
}

function windAt(t) {
  const s = race.wind_samples;
  if (!s.length) return 0;
  const step = s.length > 1 ? s[1][0] - s[0][0] : 1;
  let i = Math.round((t - s[0][0]) / step);
  i = Math.max(0, Math.min(s.length - 1, i));
  return s[i][1];
}
function windSpeedAt(t) {
  const s = race.wind_samples;
  if (!s.length) return 0;
  const step = s.length > 1 ? s[1][0] - s[0][0] : 1;
  let i = Math.round((t - s[0][0]) / step);
  i = Math.max(0, Math.min(s.length - 1, i));
  return s[i][2];
}

/* ---------- drawing ---------- */

function draw() {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
  if (!race) return;

  const showTrails = document.getElementById("trails").checked;

  // Course
  ctx.strokeStyle = "#e8eef4"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx(race.course.start_pin[0]), sy(race.course.start_pin[1]));
  ctx.lineTo(sx(race.course.start_boat[0]), sy(race.course.start_boat[1]));
  ctx.stroke();
  // Marks are deduplicated by POSITION before labelling. A two-lap course rounds
  // the same buoy twice, so marks arrive as windward-1 and windward-2 at identical
  // coordinates and their labels drew on top of each other, unreadably.
  const seen = new Map();
  for (const m of race.course.marks) {
    const key = `${m.x},${m.y}`;
    if (!seen.has(key)) seen.set(key, { m, names: [] });
    seen.get(key).names.push(m.name.replace(/-\d+$/, ""));
  }
  ctx.font = "11px ui-sans-serif, sans-serif";
  for (const { m, names } of seen.values()) {
    ctx.fillStyle = "#f5a623";
    ctx.beginPath(); ctx.arc(sx(m.x), sy(m.y), 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c98a1e";
    const label = [...new Set(names)].join(" / ") + (names.length > 1 ? ` x${names.length}` : "");
    ctx.fillText(label, sx(m.x) + 9, sy(m.y) - 6);
  }

  // Trails
  if (showTrails) {
    for (const b of race.boats) {
      const fr = b.frames;
      const now = frameAt(b, tNow);
      if (!now) continue;
      const step = fr.length > 1 ? (fr[fr.length - 1][idx.t] - fr[0][idx.t]) / (fr.length - 1) : 1;
      const here = Math.max(0, Math.min(fr.length - 1, Math.round((tNow - fr[0][idx.t]) / step)));
      const from = Math.max(0, here - Math.round(60 / step));
      ctx.strokeStyle = (selected === b.id) ? "rgba(74,168,224,.85)" : "rgba(138,163,184,.22)";
      ctx.lineWidth = (selected === b.id) ? 2 : 1;
      ctx.beginPath();
      for (let i = from; i <= here; i++) {
        const p = fr[i];
        if (i === from) ctx.moveTo(sx(p[idx.x]), sy(p[idx.y]));
        else ctx.lineTo(sx(p[idx.x]), sy(p[idx.y]));
      }
      ctx.stroke();
    }
  }

  // Boats, drawn as hulls pointing where they are going.
  for (const b of race.boats) {
    const fr = frameAt(b, tNow);
    if (!fr) continue;
    const finished = fr[idx.flags] & 4;
    const px = sx(fr[idx.x]), py = sy(fr[idx.y]);
    // Floor on drawn size: at a 500 m beat on a laptop screen a 4.2 m hull is about
    // six pixels, which is a dot rather than a boat you can read a heading off.
    const len = Math.max(11, b.length_m * view.scale);
    const rad = fr[idx.hdg] * Math.PI / 180;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(rad);                 // heading is a compass bearing; +y is north
    ctx.globalAlpha = finished ? 0.3 : 1;
    ctx.fillStyle = resolve(boatColour(b, fr));
    ctx.beginPath();
    ctx.moveTo(0, -len * 0.62);      // bow
    ctx.lineTo(len * 0.26, len * 0.42);
    ctx.lineTo(0, len * 0.24);
    ctx.lineTo(-len * 0.26, len * 0.42);
    ctx.closePath(); ctx.fill();
    if (selected === b.id) {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.restore();

    if (fr[idx.flags] & 1) {          // returning after being over early
      ctx.strokeStyle = "#f5a623"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, len * 0.9, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Wind arrow, top left, pointing the way the wind blows.
  const wdir = windAt(tNow);
  const cx = 44, cy = 44;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate((wdir + 180) * Math.PI / 180);
  ctx.strokeStyle = "#8aa3b8"; ctx.fillStyle = "#8aa3b8"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(-5, 10); ctx.lineTo(5, 10); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = "#8aa3b8"; ctx.font = "11px ui-sans-serif, sans-serif";
  ctx.fillText(`${wdir.toFixed(0)}° ${windSpeedAt(tNow).toFixed(1)} kt`, cx - 26, cy + 42);

  updatePanel();
}

/* ---------- side panel ---------- */

function standings() {
  // Live order: further round the course first, then nearer the next mark.
  return race.boats.map(b => {
    const fr = frameAt(b, tNow);
    return { b, fr, leg: fr ? fr[idx.leg] : 0, finished: fr ? (fr[idx.flags] & 4) : 0 };
  }).sort((p, q) => {
    if (p.finished && q.finished) return p.b.finish_s - q.b.finish_s;
    if (p.finished !== q.finished) return p.finished ? -1 : 1;
    if (p.leg !== q.leg) return q.leg - p.leg;
    const mark = race.course.marks[Math.min(p.leg, race.course.marks.length - 1)];
    const d = o => Math.hypot(o.fr[idx.x] - mark.x, o.fr[idx.y] - mark.y);
    return d(p) - d(q);
  });
}

function updatePanel() {
  const rows = standings();
  const body = document.getElementById("board").querySelector("tbody");
  body.innerHTML = rows.map((r, i) => {
    const c = resolve(boatColour(r.b, r.fr));
    const flag = (r.fr[idx.flags] & 2) ? " P" : (r.fr[idx.flags] & 1) ? " OCS" : "";
    return `<tr data-id="${r.b.id}" class="${selected === r.b.id ? "sel" : ""}">
      <td class="pos">${i + 1}</td>
      <td><span class="swatch" style="background:${c}"></span>${r.b.name}${flag}</td>
      <td class="num">${r.fr[idx.spd].toFixed(1)}kt</td></tr>`;
  }).join("");
  for (const tr of body.querySelectorAll("tr")) {
    tr.onclick = () => { selected = Number(tr.dataset.id); draw(); };
  }

  document.getElementById("windinfo").textContent =
    `${windAt(tNow).toFixed(0)}° at ${windSpeedAt(tNow).toFixed(1)} kt — sampled at the course centre, ` +
    `so it is the breeze on the course, not what any one boat is in.`;

  const box = document.getElementById("boatinfo");
  if (selected === null) { box.textContent = "Click a boat or a row."; }
  else {
    const b = race.boats.find(o => o.id === selected);
    const fr = frameAt(b, tNow);
    const wind = windAt(fr[idx.t]);
    const twa = ((wind - fr[idx.hdg]) % 360 + 540) % 360 - 180;
    box.innerHTML =
      `<strong>${b.name}</strong><br>` +
      `${twa >= 0 ? "starboard" : "port"} tack, TWA ${Math.abs(twa).toFixed(0)}°<br>` +
      `${fr[idx.spd].toFixed(2)} kt · leg ${fr[idx.leg] + 1}<br>` +
      `wind deficit ${(fr[idx.def] * 100).toFixed(0)}%` +
      ((fr[idx.flags] & 2) ? "<br><span style='color:#c07bff'>spinning a penalty</span>" : "") +
      ((fr[idx.flags] & 1) ? "<br><span style='color:#f5a623'>returning to start</span>" : "") +
      `<br><br>finished ${b.finish_rank}${["st","nd","rd"][b.finish_rank - 1] || "th"}` +
      ` · ${b.tacks} tacks, ${b.gybes} gybes` +
      ` · ${b.fouls} foul${b.fouls === 1 ? "" : "s"}` +
      ` · ${b.dirty_air_s.toFixed(0)}s in dirty air`;
  }

  document.getElementById("clock").textContent =
    `${tNow < 0 ? "-" : ""}${String(Math.floor(Math.abs(tNow) / 60)).padStart(2, "0")}:` +
    `${String(Math.floor(Math.abs(tNow) % 60)).padStart(2, "0")}`;
}

/* ---------- transport ---------- */

canvas.addEventListener("click", e => {
  if (!race) return;
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bestD = 18;
  for (const b of race.boats) {
    const fr = frameAt(b, tNow);
    if (!fr) continue;
    const d = Math.hypot(sx(fr[idx.x]) - mx, sy(fr[idx.y]) - my);
    if (d < bestD) { bestD = d; best = b.id; }
  }
  selected = best; draw();
});

const scrub = document.getElementById("scrub");
scrub.addEventListener("input", () => { tNow = Number(scrub.value); draw(); });
document.getElementById("play").addEventListener("click", togglePlay);
document.getElementById("colour").addEventListener("change", draw);
document.getElementById("trails").addEventListener("change", draw);
window.addEventListener("resize", () => { fit(); draw(); });
document.addEventListener("keydown", e => {
  if (!race) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  if (e.code === "ArrowRight") { tNow = Math.min(race.meta.duration_s, tNow + 5); scrub.value = tNow; draw(); }
  if (e.code === "ArrowLeft") { tNow = Math.max(race.meta.start_t, tNow - 5); scrub.value = tNow; draw(); }
});

function togglePlay() {
  if (!race) return;
  playing = !playing;
  document.getElementById("play").textContent = playing ? "Pause" : "Play";
  if (playing) { last = performance.now(); requestAnimationFrame(tick); }
}

let last = 0;
function tick(now) {
  if (!playing) return;
  const dt = (now - last) / 1000;
  last = now;
  tNow += dt * Number(document.getElementById("rate").value);
  if (tNow >= race.meta.duration_s) { tNow = race.meta.duration_s; playing = false;
    document.getElementById("play").textContent = "Play"; }
  scrub.value = tNow;
  draw();
  if (playing) requestAnimationFrame(tick);
}

fit();
</script>
</body>
</html>
